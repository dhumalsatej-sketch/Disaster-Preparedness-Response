<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial;
            background: #eef3fb;
        }
        .login-box {
            width: 350px;
            margin: 80px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #bbb;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #bbb;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #003d82;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }
        button:hover {
            background: #002d61;
        }
        h2 {
            text-align: center;
            color: #222;
        }
        a {
            text-decoration: none;
            color: #003d82;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <form>
        <label>Admin ID / Username</label>
        <input type="text" required>

        <label>Password</label>
        <input type="password" required>

        <button type="submit">Login</button>

        <p style="text-align:center; margin-top: 10px;">
            
        </p>
    </form>
</div>

</body>
</html>
