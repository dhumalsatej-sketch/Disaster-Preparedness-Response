<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Sign Up</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4fa;
        }
        .signup-box {
            width: 400px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0059b3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #004a99;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .note {
            color: red;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="signup-box">
    <h2>Admin Panel - Sign Up</h2>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Admin ID</label>
        <input type="text" placeholder="Enter admin ID" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter official email" required>

        <label>Create Password</label>
        <input type="password" placeholder="Enter password" required>

        <label>Confirm Password</label>
        <input type="password" placeholder="Re-enter password" required>


        <p class="note">* Only authorized persons should have the Security Key</p>

        <button type="submit">Create Admin Account</button>
    </form>
</div>

</body>
</html>
