<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <style>
        body {
            font-family: Arial;
            background: #e6f0ff;
        }
        .login-box {
            width: 350px;
            margin: 80px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #bbb;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #0066cc;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #004b99;
        }
        h2 {
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>

<div style="background:#003A75; padding:20px; color:white;">
    <h1 style="margin:0; font-size:32px;">
        &#128276 Disaster Preparedness & Response
    </h1>
</div>

<div class="login-box">
    <h2>Student Login</h2>

    <form>
        <label>Student ID</label>
        <input id="id" type="text" required>

        <label>Password</label>
        <input id="pass" type="password" required>

        <button type="button" onclick="loginCheck()">
            Login / Go to Home
        </button>
    </form>
</div>

<script>
function loginCheck() {
    // Demo credentials
    var correctID = "admin";
    var correctPassword = "12345";

    // Get user input
    var id = document.getElementById("id").value;
    var password = document.getElementById("pass").value;

    // Check
    if (id === correctID && password === correctPassword) {
        window.location.href = "Home_page.html";
    } else {
        alert("Invalid ID or Password");
    }
}
</script>

</body>
</html>
